server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 后端容器（compose 同一网络，服务名即 DNS 名）。
    # proxy_pass 的 host 走变量 = 请求期才解析，后端没起来时 nginx 仍能启动；
    # 变量方式必须显式指定 Docker 内嵌 DNS，不然报 "no resolver defined to resolve csssl-backend"。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ssl_backend csssl-backend:8092;

    # history 路由：刷新非根路径回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口不缓存，避免改版后拿到旧 index.html 引不到新 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 context-path 就是 /ssl，转发时不要剥前缀（含根证书 PEM 下载 / CRL / OCSP）
    location ^~ /ssl/ {
        proxy_pass http://$ssl_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
